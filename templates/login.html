<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — PresentAI</title>
    <meta name="theme-color" content="#070711">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/presentai.css') }}">
</head>
<body>

<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="page auth-wrap">

    <a href="/" class="brand" style="position:absolute; top:var(--s-5); left:var(--s-5);">
        <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/>
            </svg>
        </span>
        PresentAI
    </a>

    <main class="auth-card">
        <div class="auth-head">
            <h1>Log in</h1>
            <p class="muted">Welcome back to PresentAI</p>
        </div>

        {% if error %}
        <div class="alert alert-error" role="alert">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email"
                       placeholder="Enter your email" required autocomplete="email" autofocus />
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <div class="input-affix">
                    <input class="input" type="password" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="current-password" />
                    <button type="button" class="affix-btn" data-toggle-password="password" aria-label="Show password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
        </form>

        <div class="oauth-sep">or</div>

        <a href="/auth/google" class="oauth-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </a>

        <p class="auth-foot">
            Don't have an account? <a href="/register">Sign up</a>
        </p>
    </main>

</div>

<script src="{{ url_for('static', filename='js/presentai.js') }}" defer></script>
</body>
</html>
